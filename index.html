<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Morning Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <!-- fetch() is a reliable single signal for "modern enough to skip the iOS 9
       legacy build" — every browser that lacks it also lacks the other syntax
       app.js/style.css need. Plain ES5 so it parses on Safari 9 too. -->
  <script>
    document.write('<link rel="stylesheet" href="' + (window.fetch ? "style.css" : "style.legacy.css") + '">');
  </script>
</head>
<body>
  <main id="stage" class="stage">
    <!-- Cards are injected here by app.js -->
  </main>

  <!-- Progress dots indicating which card is showing -->
  <nav id="dots" class="dots" aria-hidden="true"></nav>

  <script>
    document.write('<script src="' + (window.fetch ? "app.js" : "app.legacy.js") + '"><' + '/script>');
  </script>
</body>
</html>
